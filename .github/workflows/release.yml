name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel cmake ninja git qt6-base qt6-svg qt6-tools cmark
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify tag matches project version
        shell: bash
        run: |
          version=$(sed -n 's/^project(textdichter VERSION \([^ )]*\).*/\1/p' CMakeLists.txt)
          if [[ "${GITHUB_REF_NAME}" != "v${version}" && "${GITHUB_REF_NAME}" != "v${version}-"* ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match project version ${version}" >&2
            exit 1
          fi
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  tarball:
    name: Build the binary tarball on Debian 13
    runs-on: ubuntu-24.04
    container: debian:13
    env:
      DEBIAN_FRONTEND: noninteractive
      LC_ALL: C.UTF-8
    steps:
      - name: Install dependencies
        run: >-
          apt-get update && apt-get install -y --no-install-recommends
          build-essential cmake ninja-build pkgconf curl ca-certificates
          qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libqt6svg6
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: sh packaging/tarball.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [verify, tarball]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: RELEASE_NOTES.md
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Textdichter ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md \
              "${release_flags[@]}"
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "Textdichter ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md \
              "${release_flags[@]}" \
              dist/*
          fi
